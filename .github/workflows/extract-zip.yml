name: Extract ZIP to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/extracted
          unzip -q "Notes-Sathi-v1.1.2 (Final).zip" -d /tmp/extracted

          ROOT=$(find /tmp/extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$ROOT" ] && [ "$(find /tmp/extracted -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then
            cp -a "$ROOT"/. .
          else
            cp -a /tmp/extracted/. .
          fi

          rm -f "Notes-Sathi-v1.1.2 (Final).zip"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract Notes-Sathi project to repository root" || echo "Nothing to commit"
          git push
